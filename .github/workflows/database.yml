name: Database

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "database/**"
      - "backend/app/Support/ArabicNormalizer.php"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "database/**"
      - "backend/app/Support/ArabicNormalizer.php"
      - ".github/workflows/database.yml"

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema, constraints & Arabic normaliser
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring
          coverage: none

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Check raqam_schema.sql is up to date
        run: |
          cat database/schema/*.sql > /tmp/expected.sql
          diff -q /tmp/expected.sql database/raqam_schema.sql \
            || { echo "::error::Run: cat database/schema/*.sql > database/raqam_schema.sql"; exit 1; }

      - name: Build schema and run all database tests
        run: ./database/run_tests.sh
