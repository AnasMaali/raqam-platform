name: Database

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "database/**"
      - "backend/app/Support/ArabicNormalizer.php"
      - ".github/workflows/database.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "database/**"
      - "backend/app/Support/ArabicNormalizer.php"
      - ".github/workflows/database.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema, constraints & Arabic normaliser
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        timeout-minutes: 10
        with:
          php-version: "8.4"
          extensions: mbstring
          coverage: none

      - name: Month (cache key of the system packages)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: System packages cache
        uses: actions/cache@v6
        timeout-minutes: 5
        with:
          path: ~/.cache/apt-archives
          key: apt-database-${{ runner.os }}-${{ steps.month.outputs.month }}-${{ hashFiles('.github/workflows/database.yml') }}
          restore-keys: apt-database-${{ runner.os }}-

      - name: Install PostgreSQL client
        timeout-minutes: 15
        run: .github/scripts/apt-install.sh postgresql-client

      - name: Check raqam_schema.sql is up to date
        timeout-minutes: 2
        run: |
          cat database/schema/*.sql > /tmp/expected.sql
          diff -q /tmp/expected.sql database/raqam_schema.sql \
            || { echo "::error::Run: cat database/schema/*.sql > database/raqam_schema.sql"; exit 1; }

      - name: Build schema and run all database tests
        timeout-minutes: 8
        run: ./database/run_tests.sh
