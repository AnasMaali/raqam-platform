name: Browser tests

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend/**"
      - "e2e/**"
      - "database/schema/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "e2e/**"
      - "database/schema/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (real browser, own database per test)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # Throwaway credentials of the CI service containers only.
    env:
      PGHOST: 127.0.0.1
      PGUSER: raqam
      PGPASSWORD: raqam
      DB_PASSWORD: raqam

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pgsql, pdo_pgsql, redis, mbstring, intl, bcmath, gd, fileinfo
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Command line clients used by the tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools ffmpeg

      - name: Create the app role
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE raqam LOGIN CREATEDB PASSWORD 'raqam'"

      - name: Install the back end
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Meilisearch v1.54.3 binary (the tests start their own engines)
        working-directory: backend
        run: ./scripts/ci-meilisearch.sh --binary-only

      - name: Install the browser tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run them
        working-directory: e2e
        run: npx playwright test

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
