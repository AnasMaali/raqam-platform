name: Secret scan

# Decision 24.12: no key ever reaches the repository. gitleaks reads the whole history on every push and pull request;
# the rules and the one narrow exception (made-up keys in the tests) are in .gitleaks.toml.
on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks v8.30.1 (checksum pinned)
        timeout-minutes: 3
        run: |
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Scan
        timeout-minutes: 5
        run: /tmp/gitleaks git --no-banner --redact --config .gitleaks.toml .
