name: Backend

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend/**"
      - "database/schema/**"
      - "database/tests/normalizer_cases.json"
      - ".github/workflows/backend.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - "database/schema/**"
      - "database/tests/normalizer_cases.json"
      - ".github/workflows/backend.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pest & schema parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    # Throwaway credentials of the CI service containers only.
    # The app role mirrors local development: CREATEDB, not a superuser.
    env:
      PGHOST: 127.0.0.1
      PGUSER: raqam
      PGPASSWORD: raqam
      DB_HOST: 127.0.0.1
      DB_USERNAME: raqam
      DB_PASSWORD: raqam

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        timeout-minutes: 10
        with:
          php-version: "8.4"
          extensions: pgsql, pdo_pgsql, redis, mbstring, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Every schema file has a migration
        timeout-minutes: 2
        run: ./scripts/check-migration-coverage.sh

      - name: Month (cache key of the system packages)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: System packages cache
        uses: actions/cache@v6
        timeout-minutes: 5
        with:
          path: ~/.cache/apt-archives
          key: apt-backend-${{ runner.os }}-${{ steps.month.outputs.month }}-${{ hashFiles('.github/workflows/backend.yml') }}
          restore-keys: apt-backend-${{ runner.os }}-

      - name: Install PostgreSQL client
        timeout-minutes: 15
        run: ../.github/scripts/apt-install.sh postgresql-client ffmpeg

      - name: Create the app role and test database
        timeout-minutes: 2
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE raqam LOGIN CREATEDB PASSWORD 'raqam'"
          createdb -O raqam raqam_testing

      - name: Composer cache
        uses: actions/cache@v6
        timeout-minutes: 5
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        timeout-minutes: 15
        run: TRY_SECONDS=400 ../.github/scripts/retry.sh composer install --no-interaction --no-progress --prefer-dist

      # Known vulnerabilities in the PHP packages (24.13); abandoned packages are reported too.
      - name: Dependency audit
        timeout-minutes: 3
        run: composer audit --no-interaction --abandoned=report

      - name: Prepare environment
        timeout-minutes: 2
        run: cp .env.example .env && php artisan key:generate

      - name: Meilisearch binary cache
        uses: actions/cache@v6
        timeout-minutes: 5
        with:
          path: ~/.cache/meilisearch-1.54.3
          key: meilisearch-1.54.3-${{ runner.os }}

      - name: Meilisearch v1.54.3 for the search tests
        timeout-minutes: 8
        run: MEILI_DIR="$HOME/.cache/meilisearch-1.54.3" ./scripts/ci-meilisearch.sh

      # One database (raqam_testing_test_N, built by the migrations) and one Redis prefix per process.
      - name: Pest
        timeout-minutes: 20
        run: php artisan test --parallel --processes=4

      - name: Schema parity (migrations == database/schema, step-by-step rollback)
        timeout-minutes: 10
        run: ./scripts/check-schema-parity.sh

      - name: migrate:fresh twice in a row
        timeout-minutes: 5
        env:
          DB_DATABASE: raqam_testing
        run: |
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:fresh --force --no-interaction

      # Every install step on the empty database, twice: the second run must change nothing and fail nothing.
      - name: raqam:install twice on the fresh database
        timeout-minutes: 5
        env:
          DB_DATABASE: raqam_testing
          MEILISEARCH_KEY: ""
        run: |
          php artisan raqam:install --no-interaction
          php artisan raqam:install --no-interaction
