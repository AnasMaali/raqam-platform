name: Frontend

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

# Made-up values. The build and the tests read the fake API (made-up demo content), and the bundle check looks for this
# token value.
env:
  API_BASE_URL: http://127.0.0.1:4010/api/v1
  API_SITE_TOKEN: ci-only-site-token-not-a-secret
  # The test server's own address, so the browser's Origin is the site's (tests/e2e/helpers.ts, `site`).
  SITE_URL: http://127.0.0.1:3100
  # Cloudflare's published test key (it always passes); the browser tests stand in for the widget anyway.
  TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  SITE_WEBHOOK_SECRET: ci-only-webhook-secret-not-a-secret
  INDEXNOW_KEY: ci-only-indexnow-key-0000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Lint, types, build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: ../.github/scripts/retry.sh npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Every colour pair passes AA in light and dark, DESIGN.md's table matches the code, no colour written by hand.
      - name: Design tokens
        run: npm run check:tokens

      - name: Fake API
        run: |
          node tests/fake-api/server.mjs 4010 > /tmp/fake-api.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4010/api/v1/site && break; sleep 1; done

      # `npm run build` also fails when the browser bundle mentions the site token.
      - name: Build
        run: npm run build

      # Development pages are gone in production, and the first load of the home page carries no motion code.
      - name: Production checks
        run: |
          npx next start -p 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/no-such-page)" = 404
          for path in /lab /lab/brand /lab/fonts /lab/home-a /lab/home-b /lab/home-c /lab/foundations; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$path")
            [ "$code" = 404 ] || { echo "::error::$path answered $code in production"; cat /tmp/next.log; exit 1; }
          done
          # An article answers 200 at its address, 301 at an old one, 404 when unknown (src/proxy.ts).
          article=$(node -e 'console.log(encodeURI(require("./tests/fake-api/fixtures/posts.json").data[0].path))')
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$article")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100/news/300/old-slug")" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100/news/12345/x")" = 404
          # A list answers 200, a page past its last 404, its feed 200.
          category=$(node -e 'console.log(encodeURI("/category/طاقة"))')
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$category")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$category/page/9")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100/feeds/categories${category#/category}")" = 200
          # A section answers 200, a page past its last 404, an unknown filter value 404, its feed 200.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/podcast)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/podcast/page/99)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100/podcast?season=99")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/feeds/sections/podcast)" = 200
          # The markets and weather pages: 200, a code in another case 301, an unknown currency or city 404; any other
          # address of two or three parts 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/currencies)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/currencies/usd)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/currencies/USD)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/currencies/xyz)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/weather)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/weather/%D9%86%D8%A7%D8%A8%D9%84%D8%B3)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/weather/xyz)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/xyz/1/abc)" = 404
          # The services, the contact page and the pages from the panel: 200; unknown or kept words 404; a renamed
          # address 301 (the platform's /redirects/lookup).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/services)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/services/podcast-episode)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/services/no-such-service)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/services/old-podcast)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/contact)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/about)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login)" = 404
          # The files for search engines: robots, llms, the sitemap and its parts, the feed, the IndexNow key file.
          for path in /robots.txt /llms.txt /sitemap.xml /sitemaps/pages.xml /sitemaps/posts-1.xml /sitemaps/news.xml /feeds/posts /ci-only-indexnow-key-0000.txt; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$path")" = 200 || { echo "::error::$path"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/sitemaps/nope.xml)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/x.txt)" = 404
          # The video library, a video, a playlist, a character: 200; unknown ones and pages past the last 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/video)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/video/23)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/video/999999999)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/video/page/99)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/video/page/1)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/awareness/characters/raqam)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/awareness/characters/no-such-character)" = 404
          # The team, the questions, «أعلن معنا» and the visitors' sitemap: 200. A bare folder's name, or a word that only
          # starts like one, is no page: 404 before the page streams.
          for path in /team /faq /advertise /sitemap; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$path")" = 200 || { echo "::error::$path"; exit 1; }
          done
          for path in /brand /feeds /api /labour /ogre; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100$path")" = 404 || { echo "::error::$path"; exit 1; }
          done
          # The search: 200 and never cached; its route refuses another site.
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3100/search?q=%D8%A7%D9%84%D8%B7%D8%A7%D9%82%D8%A9')" = 200
          curl -s -D - -o /dev/null 'http://127.0.0.1:3100/search?q=%D8%A7%D9%84%D8%B7%D8%A7%D9%82%D8%A9' | grep -qi '^cache-control:.*no-store'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Site: cross-site' 'http://127.0.0.1:3100/api/search?q=%D8%A7%D9%84%D8%B7%D8%A7%D9%82%D8%A9')" = 403
          # The webhook route refuses an unsigned message.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"type":"all"}' http://127.0.0.1:3100/api/revalidate)" = 401
          npm run check:motion

      - name: Browser
        run: ../.github/scripts/retry.sh npx playwright install --with-deps chromium

      # At 375, 768 and 1440 px, plus the sweep from 320 to 1920 px, held sideways and at 200% zoom.
      - name: Browser tests
        run: npx playwright test

      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      # What reaches the visitor stops the build on any known vulnerability.
      - name: Packages (site)
        run: npm audit --omit=dev --audit-level=low

      # The development tools (lint, tests, Lighthouse) are listed but do not stop the build: their fixes often wait
      # for the tool's own release, and forcing a newer version under a tool can break it without a sign.
      - name: Packages (development tools, report only)
        continue-on-error: true
        run: npm audit --audit-level=low

  # On its own machine with its own build, so it runs side by side with the browser tests instead of after them.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: ../.github/scripts/retry.sh npm ci

      # Lighthouse drives the tests' Chromium.
      - name: Browser
        run: ../.github/scripts/retry.sh npx playwright install --with-deps chromium

      - name: Fake API and the site
        run: |
          node tests/fake-api/server.mjs 4010 > /tmp/fake-api.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4010/api/v1/site && break; sleep 1; done
          npm run build
          npx next start -p 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done

      # A phone on a slow line, the browser really held to its speed (devtools): SEO 100, accessibility 95 or more, LCP
      # under the cap, CLS under 0.1, each the median of three runs. frontend/README.md, "Lighthouse", says why.
      - name: Lighthouse
        id: lighthouse
        run: npm run check:lighthouse

      # The same pages estimated the way PageSpeed Insights does (simulate), once each: printed with the LCP's parts,
      # never failing the build, since a page whose LCP is text reads 1.8 s or 2.7 s on a few milliseconds of the
      # scripts' start.
      - name: Lighthouse, simulated (report only)
        if: ${{ !cancelled() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure') }}
        env:
          LIGHTHOUSE_THROTTLING: simulate
          LIGHTHOUSE_REPORT_ONLY: "1"
          LIGHTHOUSE_RUNS: "1"
        run: npm run check:lighthouse
