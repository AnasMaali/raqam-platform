openapi: 3.1.0
info:
  title: Raqam content API
  version: 1.0.0
  summary: Read-only access to the published content of the Raqam platform.
  description: |
    Everything here is **read only** (except the visitor-action counters below) and serves **published content only**: drafts, scheduled items, archived items
    and anything in the trash never appear (a request for one is a 404, or a 410 when the address was deleted for good).

    * Lists have **12 items per page** (`page` starts at 1). The response carries `meta` and `links`.
    * Every response has an `ETag`; send it back in `If-None-Match` to get `304 Not Modified`. Responses are
      cacheable by a shared cache for a short time (`Cache-Control`).
    * Requests are limited per client (`429` with `Retry-After`).
    * **The site token never reaches a browser.** The website's own server sends `X-Raqam-Site-Token` (from its
      environment) and gets a higher limit. A browser never calls this API directly and CORS stays off: instant
      search goes from the browser to a route of the website on the same domain, and that route calls `/search`
      with the token and the visitor's address in `X-Raqam-Visitor-Ip`. The address is believed only together
      with a valid token, is used for the visitor's own limit, and is never stored: limit counters are keyed by
      an HMAC of it.
    * **A visitor, for every limit and counter, is an IPv4 address or an IPv6 /64.** One line gets a whole IPv6
      /64 and can change its address inside it at will, so all of its addresses are one visitor (`::ffff:a.b.c.d`
      is the IPv4 address `a.b.c.d`).
    * Errors always look like `{"error": {"code": "...", "message": "..."}}`. Messages are in Arabic.
    * Times are ISO 8601 in UTC; show them in Asia/Hebron.
    * A post's public address is `path`: `/{prefix}/{id}/{slug}`. The id identifies the post. A request with
      an old slug answers **301** to the current address; a deleted post answers **410**.
    * A **hidden awareness character** takes its cards off the whole API while it stays hidden: the card's own
      address is a 404, and it is left out of every list, count, linked-card list and text block. When the character
      is hidden or shown again the site gets a webhook with `"type": "all"` and should refresh everything.
      The same happens, once per save, when a visible character is created (after its poses and SEO are saved) and
      for any edit of a visible character, of its poses or of its SEO (name, slug, role, description, colour, Rive
      file, pose pictures, animation states, SEO texts), since the awareness page lists the characters and their cards
      appear on many pages: `{"type": "all", "change": "character_created" | "character_hidden" | "character_shown" |
      "character_updated", "id": …, "paths": []}`.
    * **Rates and money are decimal strings** (`"3.106"`), never JSON numbers: do the arithmetic with a decimal
      library or show them as they come. When the currency board changes (a new publication, a manual rate, a
      spread, the list) the site gets `{"type": "currencies", "change": "rates_published" | "manual_rate" | "board" |
      "source", "paths": ["/currencies"]}`. A manual rate that simply runs out sends nothing: the board answers are
      cached only until that moment, so refresh `/currencies` at least every few minutes.
    * **Ads** (`/ads`): every slot with its reserved sizes, the campaigns that may fill it now and what an empty slot
      shows. Pick one campaign per slot and render with `weight` (weighted random: a campaign with weight 80 shows twice
      as often as one with 40), dropping any whose `starts_at`/`ends_at` no longer hold at render time. Reserve the
      slot's size before the picture loads. Mark every ad with `meta.label` ("إعلان"). Link the picture to `click_url`
      with `rel="sponsored noopener"` (`rel`): the click is counted there and the browser is sent on (302) to the
      advertiser. When a slot has no campaign, show `house` if present, otherwise nothing. When an ad is at least half
      on screen (IntersectionObserver, threshold 0.5) report it once per page view to `POST /ads/impressions` **through
      a route of the website** that adds the site token, `X-Raqam-Visitor-Ip` and `X-Raqam-Visitor-Ua` (the browser
      never holds the token). The popup's `frequency_cap_hours` is kept in the visitor's browser (localStorage, no
      cookie). A change to campaigns or slots sends `{"type": "ads", "change": "campaign" | "placement", "paths": []}`;
      a campaign starting or ending by its own times sends nothing, so refresh `/ads` at least every minute or two.
    * **Services** (`/services`, `/services/{slug}`, `/advertise`): prices are decimal strings with a ready `text`; a
      special offer ends by itself (answers are cached only until then). A change in the panel sends
      `{"type": "services", "change": "service", "paths": ["/services", "/services/{slug}", "/advertise"]}`. Contact
      button presses are counted through `POST /services/{slug}/contact`, sent by the website's server like ad views.
    * **Weather** sends no webhook (every city changes every hour): refresh weather pages every 10 minutes. Every
      weather answer carries `meta.attribution` ("Weather data © OpenWeather"), which must be visible wherever
      the weather is shown (the free plan's condition).
  license:
    name: Proprietary
servers:
  - url: /api/v1
tags:
  - name: Posts
  - name: Taxonomy
  - name: People
  - name: Videos
  - name: Awareness
  - name: Pages
  - name: Redirects
  - name: Search
  - name: Markets
  - name: Weather
  - name: Ads
  - name: Services
  - name: Contact
  - name: Newsletter

paths:
  /posts:
    get:
      tags: [Posts]
      summary: Published posts, newest first
      operationId: listPosts
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: kind
          in: query
          description: Only this kind of content.
          schema: { $ref: '#/components/schemas/KindCode' }
        - name: category
          in: query
          description: Slug of a category. A main category includes its sub-categories.
          schema: { $ref: '#/components/schemas/Slug' }
        - name: tag
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: section
          in: query
          description: Slug of a special section (e.g. `podcast`).
          schema: { $ref: '#/components/schemas/Slug' }
        - name: author
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: guest
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: featured
          in: query
          description: Only featured posts (`1`).
          schema: { type: string, enum: ['1'] }
        - name: breaking
          in: query
          description: Only posts that are breaking right now (`1`).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: One page of posts.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PostSummary' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  links: { $ref: '#/components/schemas/PageLinks' }
        '304': { $ref: '#/components/responses/NotModified' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /posts/{id}:
    get:
      tags: [Posts]
      summary: One published post, by its id
      operationId: showPost
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200': { $ref: '#/components/responses/Post' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /posts/{id}/{slug}:
    get:
      tags: [Posts]
      summary: One published post, checking the slug
      description: |
        Same as `/posts/{id}`, but when `slug` is not the current slug the answer is **301** to the current address
        (`Location` is the API address, `path` in the body is the public one).
      operationId: showPostWithSlug
      parameters:
        - $ref: '#/components/parameters/PostId'
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Post' }
        '301':
          description: The slug is an old one.
          headers: { Location: { schema: { type: string } } }
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string, example: /news/12/عنوان-جديد }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /categories:
    get:
      tags: [Taxonomy]
      summary: Visible categories with their sub-categories, in the admin's order
      operationId: listCategories
      responses:
        '200':
          description: The category tree.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CategoryNode' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /categories/{slug}:
    get:
      tags: [Taxonomy]
      summary: One category
      operationId: showCategory
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: The category.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CategoryNode' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tags:
    get:
      tags: [Taxonomy]
      summary: Tags that have published posts, most used first
      operationId: listTags
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: One page of tags.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Tag' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  links: { $ref: '#/components/schemas/PageLinks' }
        '304': { $ref: '#/components/responses/NotModified' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tags/{slug}:
    get:
      tags: [Taxonomy]
      summary: One tag
      operationId: showTag
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: The tag.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tag' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sections:
    get:
      tags: [Taxonomy]
      summary: The visible special sections, in the admin's order
      operationId: listSections
      responses:
        '200':
          description: The sections.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Section' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sections/{slug}:
    get:
      tags: [Taxonomy]
      summary: One visible section
      operationId: showSection
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: The section.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Section' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /authors:
    get:
      tags: [People]
      summary: Active writers, A to Z
      operationId: listAuthors
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: One page of writers.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Author' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  links: { $ref: '#/components/schemas/PageLinks' }
        '304': { $ref: '#/components/responses/NotModified' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /authors/{slug}:
    get:
      tags: [People]
      summary: One writer
      operationId: showAuthor
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: The writer.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Author' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /guests:
    get:
      tags: [People]
      summary: Guests, A to Z
      operationId: listGuests
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: One page of guests.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Guest' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  links: { $ref: '#/components/schemas/PageLinks' }
        '304': { $ref: '#/components/responses/NotModified' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /guests/{slug}:
    get:
      tags: [People]
      summary: One guest
      operationId: showGuest
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: The guest.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GuestPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /awareness:
    get:
      tags: [Awareness]
      summary: The awareness page - the section, its characters and the newest cards
      operationId: awarenessPage
      responses:
        '200':
          description: The page.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [section, characters, latest]
                    properties:
                      section: { $ref: '#/components/schemas/Section' }
                      characters: { type: array, items: { $ref: '#/components/schemas/Character' } }
                      latest: { type: array, items: { $ref: '#/components/schemas/AwarenessCard' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /characters:
    get:
      tags: [Awareness]
      summary: The visible characters, in order
      operationId: listCharacters
      responses:
        '200':
          description: The characters.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Character' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /characters/{slug}:
    get:
      tags: [Awareness]
      summary: One character with its poses
      operationId: showCharacter
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: The character.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Character' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /characters/{slug}/cards:
    get:
      tags: [Awareness]
      summary: Every published card the character has said, newest first
      operationId: listCharacterCards
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: One page of cards.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AwarenessCard' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  links: { $ref: '#/components/schemas/PageLinks' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /videos:
    get:
      tags: [Videos]
      summary: The video library, newest first
      description: Only videos a visitor can play and that are in use (in a published item or a visible playlist).
      operationId: listVideos
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: section
          in: query
          description: Slug of a special section; videos of its playlists or of its items.
          schema: { $ref: '#/components/schemas/Slug' }
        - name: playlist
          in: query
          description: Slug of a playlist.
          schema: { $ref: '#/components/schemas/Slug' }
      responses:
        '200':
          description: One page of videos.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Video' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  links: { $ref: '#/components/schemas/PageLinks' }
        '304': { $ref: '#/components/responses/NotModified' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /videos/{id}:
    get:
      tags: [Videos]
      summary: One video with its chapters and structured data
      operationId: showVideo
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses:
        '200':
          description: The video.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Video' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /playlists:
    get:
      tags: [Videos]
      summary: Visible playlists (podcast seasons are playlists)
      operationId: listPlaylists
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: One page of playlists.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Playlist' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  links: { $ref: '#/components/schemas/PageLinks' }
        '304': { $ref: '#/components/responses/NotModified' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /playlists/{slug}:
    get:
      tags: [Videos]
      summary: One playlist with its videos in order (the first 200)
      operationId: showPlaylist
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: The playlist.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlaylistDetail' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sitemaps/videos:
    get:
      tags: [Videos]
      summary: Data for the video sitemap
      description: One entry for every page that shows a video (the video's own page and each published item that uses it). The website writes the XML.
      operationId: videoSitemap
      responses:
        '200':
          description: The entries.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VideoSitemapEntry' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /pages:
    get:
      tags: [Pages]
      summary: Published static pages (without their text)
      operationId: listPages
      responses:
        '200':
          description: The pages.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PageSummary' } }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /pages/{slug}:
    get:
      tags: [Pages]
      summary: One published static page
      operationId: showPage
      parameters: [{ $ref: '#/components/parameters/Slug' }]
      responses:
        '200':
          description: The page with its text.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Page' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /redirects/lookup:
    get:
      tags: [Redirects]
      summary: What to do with an address the site does not know
      description: |
        For addresses managed by hand or left behind by deleted content. `301`/`302` carry the new address,
        `410` means gone for good, `404` means nothing is known. Each answer counts as a visit of the redirect.
      operationId: lookupRedirect
      parameters:
        - name: path
          in: query
          required: true
          description: The address as the visitor typed it, starting with `/` (decoded, not percent-encoded).
          schema: { type: string, minLength: 1, maxLength: 500, pattern: '^/' }
      responses:
        '301': { $ref: '#/components/responses/Redirect' }
        '302': { $ref: '#/components/responses/Redirect' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /search:
    get:
      tags: [Search]
      summary: Search the published content (instant, filtered, highlighted)
      description: |
        Searches items of every kind, and on an unfiltered first page also videos, writers, guests and tags
        (decision 10). Arabic is understood as the site writes it: hamza forms, ta marbuta, alef maqsura,
        diacritics, Arabic digits and the definite article («ال», «وال», «بال», «فال», «كال», «لل») do not stop a
        match; small typos are tolerated; the admin's synonyms are used. Only what a visitor may see is
        returned (published and live, not trashed, not the card of a hidden character), each row checked again
        against the database.

        * **Instant search:** call this while the visitor types, 250 ms after the last key. Send `track=1` only
          when the visitor settles on the query (Enter, or opening the results page), so statistics count
          searches, not keystrokes. A query that looks like an e-mail address, a phone number or a number of six
          digits or more is never recorded.
        * `highlight` holds the title (and summary) as **HTML**: the original text escaped, with the matched
          words in `<mark>`. Insert it as HTML; it contains no other tag.
        * Only the first 10 words of a query count (as in the engine).
        * When nothing is found: `suggestions` (close words to offer as links), `latest` and `most_read`.
        * `engine` is `meilisearch`, or `database` when the search engine is down and a simpler search on the
          database answered (title, subtitle and summary only, no typo tolerance).
        * The answer is never cached (`Cache-Control: no-store`) and carries `X-Robots-Tag: noindex`: the
          search page must be `noindex` too (10.12).
        * Limited to **60 requests a minute per visitor** (10.13). Call it from the site's server with
          `X-Raqam-Site-Token` and `X-Raqam-Visitor-Ip` (see the API description); without the token the limit
          counts the caller's own address.
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          description: What the visitor typed (trimmed by the server).
          schema: { type: string, minLength: 2, maxLength: 120 }
        - name: category
          in: query
          description: Slug of a category. A main category includes its sub-categories. An unknown slug finds nothing.
          schema: { $ref: '#/components/schemas/Slug' }
        - name: section
          in: query
          description: Slug of a special section (e.g. `podcast`).
          schema: { $ref: '#/components/schemas/Slug' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/KindCode' }
        - name: from
          in: query
          description: Published on or after this day (Asia/Hebron).
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Published on or before this day (Asia/Hebron). Not before `from`.
          schema: { type: string, format: date }
        - name: sort
          in: query
          description: Most relevant first (default) or newest first.
          schema: { type: string, enum: [relevance, latest], default: relevance }
        - name: track
          in: query
          description: '`1` when the visitor settled on this query: it is counted in the search statistics.'
          schema: { type: string, enum: ['1'] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 1 }
        - name: X-Raqam-Site-Token
          in: header
          description: The website's server only. Never sent from a browser.
          schema: { type: string }
        - name: X-Raqam-Visitor-Ip
          in: header
          description: The visitor's address as the website's server saw it. Ignored without a valid site token.
          schema: { type: string }
      responses:
        '200':
          description: The results.
          headers:
            X-Robots-Tag: { schema: { const: 'noindex, nofollow' } }
            Cache-Control: { schema: { type: string, example: 'no-store, private' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /currencies:
    get:
      tags: [Markets]
      summary: The currency board, in the admin's order
      description: |
        Shekels per one unit of each currency (decision 11): the official representative rate of the Bank of Israel
        (`mid`), and the buy and sell rates shown to visitors (the official rate minus/plus the currency's spread, or
        a manual rate the admin set until a chosen time: `is_manual`). AED and SAR come from the dollar at their
        fixed pegs (`is_pegged`). `change_pct` and `direction` compare with the previous publication day. Every rate
        is a decimal string rounded to `decimals` places. Only currencies that have a rate are listed.
        Read from the platform's own data: answering never waits for the bank. `meta.note` must be shown with the
        rates (11.10), and `meta.published_at` / `meta.checked_at` as the publication date and "last update".
      operationId: currencyBoard
      responses:
        '200':
          description: The board.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CurrencyRate' } }
                  meta: { $ref: '#/components/schemas/RatesMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /currencies/ticker:
    get:
      tags: [Markets]
      summary: The short currency strip (11.8)
      operationId: currencyTicker
      responses:
        '200':
          description: The strip, in the board's order.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [code, name, symbol, mid, change_pct, direction]
                      properties:
                        code: { $ref: '#/components/schemas/CurrencyCode' }
                        name: { type: string }
                        symbol: { type: string }
                        mid: { $ref: '#/components/schemas/DecimalOrNull' }
                        change_pct: { $ref: '#/components/schemas/DecimalOrNull' }
                        direction: { $ref: '#/components/schemas/Direction' }
                  meta: { $ref: '#/components/schemas/RatesMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /currencies/converter:
    get:
      tags: [Markets]
      summary: What the converter needs (11.7)
      description: |
        From a currency to shekels: amount × `buy`. From shekels to a currency: amount ÷ `sell`. The converter shows
        which of the two it used (`rules`). Compute in the browser with decimals, from these strings.
      operationId: currencyConverter
      responses:
        '200':
          description: Buy and sell rates per currency.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [base, currencies, rules]
                    properties:
                      base: { const: ILS }
                      currencies:
                        type: array
                        items:
                          type: object
                          required: [code, name, symbol, decimals, buy, sell, is_manual]
                          properties:
                            code: { $ref: '#/components/schemas/CurrencyCode' }
                            name: { type: string }
                            symbol: { type: string }
                            decimals: { type: integer, minimum: 0, maximum: 6 }
                            buy: { $ref: '#/components/schemas/Decimal' }
                            sell: { $ref: '#/components/schemas/Decimal' }
                            is_manual: { type: boolean }
                      rules:
                        type: object
                        required: [to_base, from_base]
                        properties:
                          to_base: { $ref: '#/components/schemas/ConverterRule' }
                          from_base: { $ref: '#/components/schemas/ConverterRule' }
                  meta: { $ref: '#/components/schemas/RatesMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /currencies/{code}/history:
    get:
      tags: [Markets]
      summary: The official rate of one currency per publication day (11.9 chart)
      description: One point per day the bank published (the day's last rate, Palestine dates), oldest first.
      operationId: currencyHistory
      parameters:
        - name: code
          in: path
          required: true
          description: ISO code of a currency shown on the board (case does not matter).
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - name: days
          in: query
          description: How many days back.
          schema: { type: integer, minimum: 7, maximum: 365, default: 30 }
      responses:
        '200':
          description: The points.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [code, name, symbol, decimals, points]
                    properties:
                      code: { $ref: '#/components/schemas/CurrencyCode' }
                      name: { type: string }
                      symbol: { type: string }
                      decimals: { type: integer, minimum: 0, maximum: 6 }
                      points:
                        type: array
                        items:
                          type: object
                          required: [date, mid]
                          properties:
                            date: { type: string, format: date }
                            mid: { $ref: '#/components/schemas/Decimal' }
                  meta: { $ref: '#/components/schemas/RatesMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /weather/cities:
    get:
      tags: [Weather]
      summary: The weather cities, in the admin's order
      description: |
        With their coordinates, so the **browser** can pick the nearest city itself (12.5): ask the visitor for
        their position with the browser's geolocation (only after they press a button), compute the distance to
        each city there (haversine), and remember the choice in the browser. The visitor's position never leaves
        the browser: no endpoint takes coordinates, and none must be added. `is_default` (Nablus) is the city
        shown before any choice.
      operationId: weatherCities
      responses:
        '200':
          description: The cities.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WeatherCity' } }
                  meta: { $ref: '#/components/schemas/WeatherMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /weather/widget:
    get:
      tags: [Weather]
      summary: Every city with its weather now, small enough for the header widget (12.9)
      operationId: weatherWidget
      responses:
        '200':
          description: The cities, each with `now` (null until its first fetch).
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/WeatherCity' }
                        - type: object
                          required: [now]
                          properties:
                            now:
                              oneOf:
                                - { $ref: '#/components/schemas/WeatherNowShort' }
                                - { type: 'null' }
                  meta: { $ref: '#/components/schemas/WeatherMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /weather/{slug}:
    get:
      tags: [Weather]
      summary: One city's weather page ("طقس نابلس اليوم", indexable, 12.11)
      description: |
        The weather now (temperature, condition text and icon for day or night, today's low and high, humidity,
        wind) and five days of forecast, today first (the free forecast covers the next 120 hours). Celsius and km/h. `now.stale` is true when the last observation is more than
        three hours old (the source has not answered): say when it was measured. A hidden or unknown city is a 404.
      operationId: weatherCity
      parameters:
        - name: slug
          in: path
          required: true
          description: The city's address (Arabic, URL-encoded).
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: The city's weather.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/WeatherCity' }
                      - type: object
                        required: [now, forecast]
                        properties:
                          now:
                            oneOf:
                              - { $ref: '#/components/schemas/WeatherNow' }
                              - { type: 'null' }
                          forecast:
                            type: array
                            maxItems: 5
                            items: { $ref: '#/components/schemas/WeatherDay' }
                  meta: { $ref: '#/components/schemas/WeatherMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /ads:
    get:
      tags: [Ads]
      summary: The ad slots, the live campaigns of each, and what an empty slot shows (decision 13)
      description: |
        Every slot, in the site's order, whether it is on (`active`), its reserved sizes per device (13.10; a missing
        size means the slot does not exist on that device, e.g. the mobile bar on a desktop), lazy loading (13.11), the
        popup's frequency, and `empty`: `house` (show `house`, the «أعلن معنا» banner, when no campaign fills it) or
        `hide`. `ads` are the campaigns live now in that slot (13.4), highest priority first, with both pictures the slot
        needs. Cached briefly; never kept past the next start or end of a campaign.
      operationId: listAdSlots
      responses:
        '200':
          description: The slots.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdSlot' } }
                  meta:
                    type: object
                    required: [label, rotation, generated_at, adsense]
                    properties:
                      label: { type: string, description: 'Show it on every ad ("إعلان").' }
                      rotation: { type: string, enum: [weighted] }
                      generated_at: { type: string, format: date-time }
                      adsense:
                        type: object
                        description: AdSense is off in V1 (13.15); the slots work without it.
                        required: [enabled, client]
                        properties:
                          enabled: { type: boolean }
                          client: { type: [string, 'null'] }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /ads/click/{campaign}/{placement}/{signature}:
    get:
      tags: [Ads]
      summary: The click link of an ad (13.7)
      description: |
        Use the `click_url` of `/ads` as it is; never build it. The click is counted (people only, once per few seconds
        per visitor, campaign and slot), then the browser is sent with **302** to the address stored with the campaign
        and nowhere else: the link carries no destination, so it cannot send anyone to another site. A link that was
        not issued by `/ads` (wrong signature) is a 404. A campaign that has since ended or been paused still sends the
        visitor on, without counting. Never cached, and never refused for too many requests: a visitor always goes on.
      operationId: adClick
      parameters:
        - { name: campaign, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: placement, in: path, required: true, schema: { $ref: '#/components/schemas/AdPlacementCode' } }
        - { name: signature, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } }
      responses:
        '302':
          description: On to the advertiser.
          headers: { Location: { schema: { type: string, format: uri } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /ads/impressions:
    post:
      tags: [Ads]
      summary: Report the ads a visitor saw (13.6)
      description: |
        Send the ads that were at least half on screen in one page view, once. `view_id` is a random id the page makes
        for that page view (8–64 of `A-Z a-z 0-9 _ -`); the same view of the same ad is counted once. **Only reports
        from the website's server are counted:** send it through a route of the site on the same domain (like instant
        search), which adds the site token, `X-Raqam-Visitor-Ip` and `X-Raqam-Visitor-Ua`. A report without a valid
        token or without a valid visitor address is answered 204 like any other and counts nothing. The visitor's
        limit and identity are an HMAC of that address (an IPv6 address by its /64), never the address. Robots are not
        counted. JSON only. The answer is 204 whether or not anything was counted.
      operationId: reportAdImpressions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view_id, items]
              additionalProperties: false
              properties:
                view_id: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
                items:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items:
                    type: object
                    required: [campaign_id, placement]
                    additionalProperties: false
                    properties:
                      campaign_id: { type: integer, minimum: 1 }
                      placement: { $ref: '#/components/schemas/AdPlacementCode' }
      responses:
        '204': { description: Received. }
        '415': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /services:
    get:
      tags: [Services]
      summary: The services and prices page (decision 14)
      description: |
        The page's intro (the published system page "services", or null) and the visible services by group, in the
        admin's order, each with its price ready to show (`price.text`), a special offer while it lasts (`price.offer`:
        the offer is the price, `was` the regular one; it ends by itself at `ends_at`), contact links that name the
        service, and the booking button (`booking.enabled` is false while booking is off: show no booking button).
        Cached briefly, never past the end of an offer: `Cache-Control` is cut so that no cache keeps the answer, or
        serves it stale, after the next special offer ends (the same for `/services/{slug}` and `/advertise`). Switching
        booking or changing a contact setting drops the cached answers at once.
      operationId: listServices
      responses:
        '200':
          description: The page.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [page, groups]
                    properties:
                      page: { oneOf: [{ $ref: '#/components/schemas/SystemPageText' }, { type: 'null' }] }
                      groups:
                        type: array
                        items:
                          type: object
                          required: [id, name, services]
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            services: { type: array, items: { $ref: '#/components/schemas/ServiceCard' } }
                  meta: { $ref: '#/components/schemas/ServicesMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /services/{slug}:
    get:
      tags: [Services]
      summary: One service's page (14.7)
      description: |
        Everything on the card plus the full description (cleaned HTML), what the service includes, its published FAQ,
        up to six published examples from its section, SEO, and `structured_data` (schema.org Service with an Offer;
        no Offer when the price is on request) to put in a JSON-LD script. A hidden or unknown service is a 404.
      operationId: showService
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The service.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/ServiceCard' }
                      - type: object
                        required: [description_html, deliverables, faqs, examples, seo, structured_data]
                        properties:
                          description_html: { type: [string, 'null'] }
                          deliverables: { type: array, items: { type: string } }
                          faqs:
                            type: array
                            items:
                              type: object
                              required: [question, answer]
                              properties: { question: { type: string }, answer: { type: string } }
                          examples: { type: array, items: { $ref: '#/components/schemas/PostSummary' } }
                          seo: { type: object }
                          structured_data: { type: object }
                  meta: { $ref: '#/components/schemas/ServicesMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /services/{slug}/contact:
    post:
      tags: [Services]
      summary: Count a press on a contact button of a service (14.9)
      description: |
        Send it when a visitor presses WhatsApp, call or e-mail on a service, **through a route of the website** with
        the site token, `X-Raqam-Visitor-Ip` and `X-Raqam-Visitor-Ua`, then let the link open. People only; the same
        visitor pressing the same button of the same service within 30 seconds counts once; at most 30 an hour per
        visitor. JSON only. 204 whether or not it was counted; a hidden or unknown service is a 404.
      operationId: countServiceContact
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [whatsapp, phone, email] }
      responses:
        '204': { description: Received. }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /contact:
    post:
      tags: [Contact]
      summary: Send the contact form (20.13)
      description: |
        **From the website's server only**: the browser posts to a route of the site on the same domain, and that route
        calls this with `X-Raqam-Site-Token`, `X-Raqam-Visitor-Ip` and `X-Raqam-Visitor-Ua`. Without the token and a
        valid visitor address: 403 `site_only`. JSON only (415 otherwise).

        Turnstile (24.10) is checked here: send the widget's token as `turnstile_token` (action `contact`). Fields are
        checked strictly (422 with the field and an Arabic reason): name 2–120 without a link or an address, a valid
        e-mail, phone optional in international form (+970599123456; Arabic digits, spaces and `00` are fine), subject
        2–200 on one line, message 2–5000. `website` is a honeypot: leave it empty and hidden.

        5 messages an hour and 20 a day per visitor (429 `too_many`); 10 requests a minute (429). Turnstile refused:
        422 `turnstile_failed`. Otherwise 202, the same answer whatever happens next: the message is kept for the panel,
        the admins are told and the sender gets one automatic reply a day at most per address.
      operationId: sendContactMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message, turnstile_token]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                phone: { type: [string, 'null'], maxLength: 30 }
                subject: { type: string, minLength: 2, maxLength: 200 }
                message: { type: string, minLength: 2, maxLength: 5000 }
                turnstile_token: { type: string, maxLength: 2048 }
                website: { type: string, description: "Honeypot: must stay empty." }
      responses:
        '202':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: object, required: [received], properties: { received: { type: boolean, const: true } } }
        '403': { description: Not the site's server., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /newsletter/subscribe:
    post:
      tags: [Newsletter]
      summary: Ask to subscribe to the newsletter (19.1, 19.2)
      description: |
        **From the website's server only** (site token + `X-Raqam-Visitor-Ip`; 403 `site_only` otherwise), JSON only (415). 10
        requests a minute per visitor (429).

        Checks Turnstile (`turnstile_token`, action `newsletter`), then answers **the same whatever the address**
        (subscribed or not, limit reached or not): a `challenge` to keep (e.g. in an httpOnly cookie of the site) and,
        when the limits allow, a 6-digit code goes to the address (valid 30 minutes, 5 tries). One address gets at most
        3 codes an hour and 6 a day, whoever asks; 10 requests an hour per visitor (429 `too_many`).
        `placement` is the form: `footer`, `post_end` or `newsletter_page`; `path` the page (kept as consent proof only
        once the code is confirmed).
      operationId: newsletterSubscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, placement, turnstile_token]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                name: { type: [string, 'null'], minLength: 2, maxLength: 120 }
                placement: { type: string, enum: [footer, post_end, newsletter_page] }
                path: { type: [string, 'null'], maxLength: 500, description: "A path of the site, starting with /." }
                turnstile_token: { type: string, maxLength: 2048 }
      responses:
        '202': { $ref: '#/components/responses/NewsletterChallenge' }
        '403': { $ref: '#/components/responses/Invalid' }
        '415': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /newsletter/resend:
    post:
      tags: [Newsletter]
      summary: Send the code again (19.2)
      description: |
        **From the website's server only** (site token + `X-Raqam-Visitor-Ip`; 403 `site_only` otherwise), JSON only (415). 10
        requests a minute per visitor (429).

        A new code for the same challenge, at least 60 seconds after the last one and within the per-address limits;
        the answer is the same whether or not one went. 422 `expired` for an unknown or old challenge.
      operationId: newsletterResend
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [challenge], properties: { challenge: { type: string } } }
      responses:
        '202': { $ref: '#/components/responses/NewsletterChallenge' }
        '403': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /newsletter/confirm:
    post:
      tags: [Newsletter]
      summary: Confirm the subscription with the code (19.2)
      description: |
        **From the website's server only** (site token + `X-Raqam-Visitor-Ip`; 403 `site_only` otherwise), JSON only (415). 10
        requests a minute per visitor (429).

        The code is good only with the challenge it was sent for. 422 `bad_code` (wrong, or its 5 tries are used) or
        `expired`. On success the address is subscribed (consent: when, page, form) and goes to Brevo.
      operationId: newsletterConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Subscribed.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [confirmed], properties: { confirmed: { type: boolean, const: true } } } } }
        '403': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /newsletter/unsubscribe:
    post:
      tags: [Newsletter]
      summary: Unsubscribe with the subscriber's own link (19.5)
      description: |
        **From the website's server only** (site token + `X-Raqam-Visitor-Ip`; 403 `site_only` otherwise), JSON only (415). 10
        requests a minute per visitor (429).

        The page `/newsletter/unsubscribe?s={subscriber}&t={signature}` of the site sends both values here (also for a
        one-click `List-Unsubscribe-Post`). 422 `invalid_link` when the signature is not that subscriber's.
      operationId: newsletterUnsubscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriber, signature]
              properties:
                subscriber: { type: [integer, string] }
                signature: { type: string }
      responses:
        '200':
          description: Unsubscribed.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [unsubscribed], properties: { unsubscribed: { type: boolean, const: true } } } } }
        '403': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /newsletter/brevo-webhook:
    post:
      tags: [Newsletter]
      summary: Brevo's marketing webhook (19.4)
      description: |
        Called by Brevo, not by the site, with `X-Raqam-Brevo-Token` (the secret `BREVO_WEBHOOK_TOKEN`; a wrong one is a
        404). One event or a list of them (`unsubscribed`, `hard_bounce`, `spam`, `contact_deleted`). Brevo does not
        sign its messages, so a message is only a hint: the subscriber changes only after Brevo's API confirms the
        contact no longer receives the list. Always 204.
      operationId: newsletterBrevoWebhook
      responses:
        '204': { description: Received. }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /advertise:
    get:
      tags: [Services]
      summary: The «أعلن معنا» page (13.14)
      description: |
        The page's text (the published system page "advertise", or null), the ad slots that are on with their sizes,
        the ad packages with their prices (the visible services of the «إعلانات» group; prices are set by the
        management in the panel), the contact links, and `booking.enabled` (false in V1: no booking button).
      operationId: advertisePage
      responses:
        '200':
          description: The page.
          headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [page, placements, packages, contact, booking]
                    properties:
                      page: { oneOf: [{ $ref: '#/components/schemas/SystemPageText' }, { type: 'null' }] }
                      placements:
                        type: array
                        items:
                          type: object
                          required: [code, name, sizes]
                          properties:
                            code: { $ref: '#/components/schemas/AdPlacementCode' }
                            name: { type: string }
                            sizes:
                              type: object
                              required: [desktop, mobile]
                              properties:
                                desktop: { oneOf: [{ $ref: '#/components/schemas/AdSize' }, { type: 'null' }] }
                                mobile: { oneOf: [{ $ref: '#/components/schemas/AdSize' }, { type: 'null' }] }
                      packages: { type: array, items: { $ref: '#/components/schemas/ServiceCard' } }
                      contact: { $ref: '#/components/schemas/ContactLinks' }
                      booking:
                        type: object
                        required: [enabled]
                        properties: { enabled: { type: boolean } }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  parameters:
    Page:
      name: page
      in: query
      description: Page number, from 1.
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    PostId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Slug:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }

  headers:
    ETag:
      description: Validator for `If-None-Match`.
      schema: { type: string }
    CacheControl:
      description: How long a shared cache may keep the answer.
      schema: { type: string }

  responses:
    Post:
      description: The post.
      headers: { ETag: { $ref: '#/components/headers/ETag' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/PostDetail' }
    NotModified:
      description: The copy the client holds is still current.
    Redirect:
      description: The address moved.
      headers: { Location: { schema: { type: string } } }
      content:
        application/json:
          schema:
            type: object
            required: [to]
            properties:
              to: { type: string, description: "The new address (a path of the site or a web address)." }
    NotFound:
      description: Nothing here (or it is not published).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Gone:
      description: Deleted for good. Do not ask again.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Invalid:
      description: A parameter is wrong.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NewsletterChallenge:
      description: The challenge to send back with the code; the same answer for every address.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [challenge, resend_after, expires_in]
                properties:
                  challenge: { type: string, description: "Opaque, encrypted. Keep it on the site's side." }
                  resend_after: { type: integer, description: Seconds before a new code can be asked for. }
                  expires_in: { type: integer, description: Seconds the code is valid. }
    TooManyRequests:
      description: Too many requests; wait `Retry-After` seconds.
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    SystemPageText:
      type: object
      required: [title, body_html, seo]
      properties:
        title: { type: string }
        body_html: { type: string }
        seo: { type: object }
    ContactLinks:
      type: object
      description: Ready links; null when the setting is empty (hide that button).
      required: [whatsapp, phone, email]
      properties:
        whatsapp: { type: [string, 'null'], description: 'https://wa.me/… with a ready message naming the service.' }
        phone: { type: [string, 'null'], description: 'tel:+970…' }
        email: { type: [string, 'null'], description: 'mailto:… with a ready subject naming the service.' }
    ServicePrice:
      type: object
      required: [mode, amount, currency, symbol, note, text, offer]
      properties:
        mode: { type: string, enum: [fixed, from, on_request] }
        amount: { type: [string, 'null'], description: 'Decimal string ("16.12"); the offer price while an offer lasts.' }
        currency: { type: [string, 'null'], enum: [ILS, USD, null] }
        symbol: { type: [string, 'null'] }
        note: { type: [string, 'null'], description: 'e.g. «للحلقة».' }
        text: { type: string, description: 'Ready to show, e.g. (made-up amounts): "123.45 ₪ للحلقة", "يبدأ من 1,234.56 ₪", "السعر عند التواصل".' }
        offer:
          oneOf:
            - type: 'null'
            - type: object
              required: [was, was_text, ends_at]
              properties:
                was: { type: string }
                was_text: { type: string }
                ends_at: { type: string, format: date-time }
    ServiceCard:
      type: object
      required: [id, slug, path, group_id, name, summary, cover, price, contact, booking]
      properties:
        id: { type: integer }
        slug: { type: string }
        path: { type: string, description: '/services/{slug}' }
        group_id: { type: integer }
        name: { type: string }
        summary: { type: string }
        cover: { oneOf: [{ $ref: '#/components/schemas/Media' }, { type: 'null' }] }
        price: { $ref: '#/components/schemas/ServicePrice' }
        contact: { $ref: '#/components/schemas/ContactLinks' }
        booking:
          type: object
          required: [enabled, path]
          properties:
            enabled: { type: boolean }
            path: { type: [string, 'null'] }
    ServicesMeta:
      type: object
      required: [booking, currency_note]
      properties:
        booking:
          type: object
          required: [enabled]
          properties: { enabled: { type: boolean } }
        currency_note: { type: string }
    AdPlacementCode:
      type: string
      enum: [header_leaderboard, sidebar_mpu, in_article, between_sections, popup, mobile_sticky]
    AdSize:
      type: object
      required: [width, height]
      properties: { width: { type: integer, minimum: 1 }, height: { type: integer, minimum: 1 } }
    AdImages:
      type: object
      description: One picture per device the slot has a size for; null for a device it has none for.
      required: [desktop, mobile]
      properties:
        desktop: { oneOf: [{ $ref: '#/components/schemas/Media' }, { type: 'null' }] }
        mobile: { oneOf: [{ $ref: '#/components/schemas/Media' }, { type: 'null' }] }
    Ad:
      type: object
      required: [id, weight, advertiser, starts_at, ends_at, images, click_url, rel]
      properties:
        id: { type: integer }
        weight: { type: integer, minimum: 1, maximum: 100, description: The campaign's priority; its share of the rotation. }
        advertiser: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        images: { $ref: '#/components/schemas/AdImages' }
        click_url: { type: string, format: uri }
        rel: { type: string, enum: ['sponsored noopener'] }
    AdSlot:
      type: object
      required: [code, name, active, sizes, lazy, frequency_cap_hours, empty, ads, house]
      properties:
        code: { $ref: '#/components/schemas/AdPlacementCode' }
        name: { type: string }
        active: { type: boolean, description: 'Off: render nothing and reserve nothing.' }
        sizes:
          type: object
          required: [desktop, mobile]
          properties:
            desktop: { oneOf: [{ $ref: '#/components/schemas/AdSize' }, { type: 'null' }] }
            mobile: { oneOf: [{ $ref: '#/components/schemas/AdSize' }, { type: 'null' }] }
        lazy: { type: boolean }
        frequency_cap_hours: { type: [integer, 'null'], description: 'Popup only: show it to a visitor at most once in this many hours.' }
        empty: { type: string, enum: [house, hide] }
        ads: { type: array, items: { $ref: '#/components/schemas/Ad' } }
        house:
          description: The «أعلن معنا» banner for an empty slot (internal link or https address), or null.
          oneOf:
            - type: 'null'
            - type: object
              required: [images, target]
              properties:
                images: { $ref: '#/components/schemas/AdImages' }
                target: { type: string }
    SearchResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [query, engine, posts, videos, authors, guests, tags]
          properties:
            query: { type: string }
            engine: { type: string, enum: [meilisearch, database] }
            posts:
              type: array
              maxItems: 12
              items: { $ref: '#/components/schemas/SearchPost' }
            videos:
              description: Up to 5, on an unfiltered first page only.
              type: array
              maxItems: 5
              items: { $ref: '#/components/schemas/SearchVideo' }
            authors: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/SearchPerson' } }
            guests: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/SearchPerson' } }
            tags: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/SearchPerson' } }
            suggestions:
              description: Only when nothing was found. Close words that do lead to results.
              type: array
              maxItems: 5
              items: { type: string }
            latest:
              description: Only when nothing was found.
              type: array
              items: { $ref: '#/components/schemas/PostSummary' }
            most_read:
              description: Only when nothing was found. Most read in the last seven days.
              type: array
              items: { $ref: '#/components/schemas/PostSummary' }
        meta:
          allOf: [{ $ref: '#/components/schemas/PageMeta' }]
          properties:
            last_page: { type: integer, minimum: 1, maximum: 50 }
        links: { $ref: '#/components/schemas/PageLinks' }
    Highlight:
      type: string
      description: The original text, HTML-escaped, with the matched words wrapped in `<mark>`. No other tag.
      example: ارتفاع أسعار <mark>الذهب</mark>
    SearchPost:
      allOf: [{ $ref: '#/components/schemas/PostSummary' }]
      type: object
      required: [highlight]
      properties:
        highlight:
          type: object
          required: [title, excerpt]
          properties:
            title: { $ref: '#/components/schemas/Highlight' }
            excerpt: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Highlight' }] }
    SearchVideo:
      type: object
      required: [id, source, path, title, duration_seconds, thumbnail_url, highlight]
      properties:
        id: { type: integer }
        source: { type: string, enum: [youtube, upload] }
        path: { type: string, example: /video/12 }
        title: { type: string }
        duration_seconds: { type: [integer, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        highlight:
          type: object
          required: [title]
          properties:
            title: { $ref: '#/components/schemas/Highlight' }
    SearchPerson:
      description: A writer, a guest or a tag.
      type: object
      required: [id, name, slug, path, highlight]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        path: { type: string, example: /author/samer }
        highlight:
          type: object
          required: [name]
          properties:
            name: { $ref: '#/components/schemas/Highlight' }
    Slug:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[^\s/?#%&]+$'
    KindCode:
      type: string
      enum: [news, report, opinion, infographic, episode, story, product, history, initiative, roundtable, awareness]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: array, items: { type: string } }
    PageMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, const: 12 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }
    PageLinks:
      type: object
      required: [next, prev]
      properties:
        next: { type: [string, 'null'], description: "Query string of the next page (e.g. `?page=2&kind=news`), null on the last page." }
        prev: { type: [string, 'null'] }
    MediaVariant:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
    Media:
      type: object
      required: [id, mime_type, url, alt, caption, credit, width, height, focal, variants]
      properties:
        id: { type: integer }
        mime_type: { type: string }
        url: { type: string, description: "The file itself (the cleaned original)." }
        alt: { type: [string, 'null'] }
        caption: { type: [string, 'null'] }
        credit: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        focal:
          description: The important point of the picture, 0 to 1 from the top-left corner; use it as `object-position`.
          oneOf:
            - type: 'null'
            - type: object
              required: [x, y]
              properties: { x: { type: number, minimum: 0, maximum: 1 }, y: { type: number, minimum: 0, maximum: 1 } }
        variants:
          description: 'Renditions: `{thumb|sm|md|lg|xl|og: {avif|webp|jpeg: MediaVariant}}`. Absent sizes or formats are simply missing.'
          type: object
          additionalProperties:
            type: object
            additionalProperties: { $ref: '#/components/schemas/MediaVariant' }
    Kind:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/KindCode' }
        name: { type: string }
    CategoryRef:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    AuthorRef:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    Organization:
      type: object
      required: [id, name, slug, website]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        website: { type: [string, 'null'] }
    PostSummary:
      type: object
      required: [id, kind, title, subtitle, excerpt, slug, path, published_at, updated_at, cover, category, authors, is_featured, is_breaking, breaking_until, sponsor]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/Kind' }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        excerpt: { type: [string, 'null'] }
        slug: { type: string }
        path: { type: string, example: /news/12/عنوان-الخبر }
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cover:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Media' }]
        category:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/CategoryRef' }]
        authors:
          description: Empty means the team («فريق رَقَم»).
          type: array
          items: { $ref: '#/components/schemas/AuthorRef' }
        is_featured: { type: boolean }
        is_breaking: { type: boolean }
        breaking_until: { type: [string, 'null'], format: date-time }
        sponsor:
          description: Present for sponsored content, which must be shown with a clear label.
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Organization' }]
    Seo:
      type: object
      required: [title, description, canonical_url, noindex, share_image]
      properties:
        title: { type: string, description: "The title for the search results (the override, or the post title)." }
        description: { type: [string, 'null'] }
        canonical_url: { type: [string, 'null'] }
        noindex: { type: boolean }
        share_image:
          oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Media' }]
    Tag:
      type: object
      required: [id, name, slug, posts_count]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        posts_count: { type: integer, minimum: 0 }
        seo: { $ref: '#/components/schemas/Seo' }
    Guest:
      type: object
      required: [id, name, slug, job_title, bio, photo, organization, links]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        job_title: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        photo: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Media' }] }
        organization: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Organization' }] }
        links: { $ref: '#/components/schemas/Links' }
        seo: { $ref: '#/components/schemas/Seo' }
    Author:
      type: object
      required: [id, name, slug, job_title, bio, photo, team_order, links]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        job_title: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        photo: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Media' }] }
        team_order: { type: [integer, 'null'], description: "Position on the team page, null if not on it." }
        links: { $ref: '#/components/schemas/Links' }
        seo: { $ref: '#/components/schemas/Seo' }
    Links:
      type: object
      description: Platform code to address.
      additionalProperties: { type: string }
    CategoryNode:
      type: object
      required: [id, name, slug, description, is_highlighted, children]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        is_highlighted: { type: boolean }
        parent: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/CategoryRef' }] }
        children:
          type: array
          items:
            type: object
            required: [id, name, slug, description]
            properties:
              id: { type: integer }
              name: { type: string }
              slug: { type: string }
              description: { type: [string, 'null'] }
        seo: { $ref: '#/components/schemas/Seo' }
    Section:
      type: object
      required: [id, key, name, slug, description, cover]
      properties:
        id: { type: integer }
        key: { type: string, enum: [podcast, success_stories, made_in_nablus, nablus_history, initiatives, round_table, awareness] }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        cover: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Media' }] }
        seo: { $ref: '#/components/schemas/Seo' }
    PageSummary:
      type: object
      required: [slug, title, system_key]
      properties:
        slug: { type: string }
        title: { type: string }
        system_key: { type: [string, 'null'], description: 'For the standard pages: about, privacy, terms ...' }
    Page:
      type: object
      required: [slug, title, system_key, body_html, updated_at, seo]
      properties:
        slug: { type: string }
        title: { type: string }
        system_key: { type: [string, 'null'] }
        body_html: { type: string, description: "Cleaned HTML, safe to inject." }
        updated_at: { type: string, format: date-time }
        seo: { $ref: '#/components/schemas/Seo' }
    Character:
      type: object
      required: [id, name, slug, role, description, accent_color, rive, poses, cards_count, seo]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        role: { type: string }
        description: { type: [string, 'null'] }
        accent_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: "Readable on the page background (contrast 4.5 to 1 at least)." }
        rive: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Media' }], description: The animation file; null means still pictures only. }
        poses:
          type: array
          description: The poses that have a picture, in the order explaining, warning, smiling, pointing, thinking.
          items:
            type: object
            required: [code, name, image, rive_state]
            properties:
              code: { type: string, enum: [explaining, warning, smiling, pointing, thinking] }
              name: { type: string }
              image: { $ref: '#/components/schemas/Media', description: "The still picture; also what weak devices and 'reduce motion' show." }
              rive_state: { type: [string, 'null'], description: The state to play in the Rive file. }
        cards_count: { type: integer, minimum: 0 }
        seo: { $ref: '#/components/schemas/Seo' }
    AwarenessCard:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required: [awareness]
          properties:
            awareness: { $ref: '#/components/schemas/AwarenessDetails' }
    GuestPage:
      allOf:
        - $ref: '#/components/schemas/Guest'
        - type: object
          required: [appearances]
          properties:
            appearances:
              type: array
              description: Every published item the guest appears in, newest first (the first 200).
              items:
                type: object
                required: [role, post]
                properties:
                  role: { type: object, required: [code, name], properties: { code: { type: string, enum: [host, guest, panelist] }, name: { type: string } } }
                  post: { $ref: '#/components/schemas/PostSummary' }
    Video:
      type: object
      required: [id, source, path, title, description, duration_seconds, thumbnail_url, published_at, youtube, upload, chapters, structured_data]
      properties:
        id: { type: integer }
        source: { type: string, enum: [youtube, upload] }
        path: { type: string, example: /video/12, description: "The video's own page on the website." }
        title: { type: string, description: "The title the site shows (ours when set, otherwise YouTube's)." }
        description: { type: [string, 'null'] }
        duration_seconds: { type: [integer, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        published_at: { type: string, format: date-time }
        youtube:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, is_short, watch_url, embed_url]
              properties:
                id: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
                is_short: { type: boolean }
                watch_url: { type: string }
                embed_url: { type: string, description: "A youtube-nocookie address; load it only when the visitor presses play." }
        upload:
          oneOf:
            - type: 'null'
            - type: object
              required: [url, mime_type, width, height]
              properties:
                url: { type: string }
                mime_type: { const: video/mp4 }
                width: { type: [integer, 'null'] }
                height: { type: [integer, 'null'] }
        chapters:
          type: array
          items:
            type: object
            required: [start, time, title]
            properties:
              start: { type: integer, minimum: 0, description: "Seconds from the start; seek the player here." }
              time: { type: string, example: '12:30' }
              title: { type: string }
        structured_data:
          type: object
          description: "A schema.org VideoObject (with a Clip for each chapter) for a JSON-LD script. Titles and descriptions are free text: when embedding in HTML escape `<` as `\\u003c` (or serialise with a function that does), so text can never close the script tag."
          required: ['@context', '@type', name, description, thumbnailUrl, uploadDate]
          properties:
            '@context': { const: 'https://schema.org' }
            '@type': { const: VideoObject }
    Playlist:
      type: object
      required: [id, name, slug, description, cover, section, season_number, videos_count, seo]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        cover: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Media' }] }
        section:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, slug]
              properties: { id: { type: integer }, name: { type: string }, slug: { type: string } }
        season_number: { type: [integer, 'null'], description: "The podcast season this playlist is, if any." }
        videos_count: { type: integer, minimum: 0 }
        seo: { $ref: '#/components/schemas/Seo' }
    PlaylistDetail:
      allOf:
        - $ref: '#/components/schemas/Playlist'
        - type: object
          required: [videos]
          properties:
            videos: { type: array, items: { $ref: '#/components/schemas/Video' } }
    VideoSitemapEntry:
      type: object
      required: [page_path, video]
      properties:
        page_path: { type: string, description: "The page that shows the video." }
        video:
          type: object
          required: [id, title, description, thumbnail_url, content_url, player_url, duration_seconds, publication_date]
          properties:
            id: { type: integer }
            title: { type: string }
            description: { type: string }
            thumbnail_url: { type: [string, 'null'] }
            content_url: { type: [string, 'null'], description: "The file itself (uploaded clips)." }
            player_url: { type: [string, 'null'], description: "The embeddable player (YouTube videos)." }
            duration_seconds: { type: [integer, 'null'] }
            publication_date: { type: string, format: date-time }
    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required: [body_html, video, awareness_cards, tags, gallery, guests, details, related, correction, seo, revision]
          properties:
            video:
              description: The main video, null when there is none or it can no longer be played.
              oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/Video' }]
            body_html:
              type: string
              description: Cleaned HTML with every block (picture, gallery, awareness card, "read also") already built. Safe to inject.
            awareness_cards:
              description: Published awareness cards linked to this item (the ones in the text and the ones picked for it).
              type: array
              items: { $ref: '#/components/schemas/AwarenessCard' }
            tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
            gallery: { type: array, items: { $ref: '#/components/schemas/Media' } }
            guests:
              type: array
              items:
                type: object
                required: [role, guest]
                properties:
                  role: { type: object, required: [code, name], properties: { code: { type: string, enum: [host, guest, panelist] }, name: { type: string } } }
                  guest: { $ref: '#/components/schemas/Guest' }
            details:
              description: The facts of the kind (episode, story, ...); null for news, reports and opinion pieces.
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/EpisodeDetails'
                - $ref: '#/components/schemas/StoryDetails'
                - $ref: '#/components/schemas/ProductDetails'
                - $ref: '#/components/schemas/HistoryDetails'
                - $ref: '#/components/schemas/InitiativeDetails'
                - $ref: '#/components/schemas/RoundtableDetails'
                - $ref: '#/components/schemas/AwarenessDetails'
                - $ref: '#/components/schemas/InfographicDetails'
            related:
              description: Posts the text points to with "read also" (published ones only).
              type: array
              items: { $ref: '#/components/schemas/PostSummary' }
            correction:
              oneOf:
                - type: 'null'
                - type: object
                  required: [note, corrected_at]
                  properties: { note: { type: string }, corrected_at: { type: string, format: date-time } }
            seo: { $ref: '#/components/schemas/Seo' }
            revision:
              type: string
              description: Changes whenever the text or the facts change; handy as a cache key.
    EpisodeDetails:
      type: object
      required: [kind, season, episode_number]
      properties:
        kind: { const: episode }
        season: { type: object, required: [number, title], properties: { number: { type: integer }, title: { type: [string, 'null'] } } }
        episode_number: { type: integer }
    StoryDetails:
      type: object
      required: [kind, organization, person_name, figures]
      properties:
        kind: { const: story }
        organization: { $ref: '#/components/schemas/Organization' }
        person_name: { type: [string, 'null'] }
        figures: { type: array, items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string } } } }
    ProductDetails:
      type: object
      required: [kind, product_name, organization, contact_url, contact_phone]
      properties:
        kind: { const: product }
        product_name: { type: string }
        organization: { $ref: '#/components/schemas/Organization' }
        contact_url: { type: [string, 'null'] }
        contact_phone: { type: [string, 'null'] }
    HistoryDetails:
      type: object
      required: [kind, era, period_label, year_from, year_to]
      properties:
        kind: { const: history }
        era: { type: object, required: [id, name], properties: { id: { type: integer }, name: { type: string } } }
        period_label: { type: [string, 'null'] }
        year_from: { type: [integer, 'null'] }
        year_to: { type: [integer, 'null'] }
    InitiativeDetails:
      type: object
      required: [kind, initiative_name, organizer, status, url]
      properties:
        kind: { const: initiative }
        initiative_name: { type: string }
        organizer: { $ref: '#/components/schemas/Organization' }
        status: { type: string, enum: [ongoing, ended] }
        url: { type: [string, 'null'] }
    RoundtableDetails:
      type: object
      required: [kind, held_on]
      properties:
        kind: { const: roundtable }
        held_on: { type: string, format: date }
    AwarenessDetails:
      type: object
      required: [kind, type, character, pose]
      properties:
        kind: { const: awareness }
        type: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } }
        character: { type: object, required: [id, name, slug, accent_color], properties: { id: { type: integer }, name: { type: string }, slug: { type: string }, accent_color: { type: string } } }
        pose: { type: object, required: [code, name, image], properties: { code: { type: string }, name: { type: string }, image: { $ref: '#/components/schemas/Media' } } }
    InfographicDetails:
      type: object
      required: [kind, download]
      properties:
        kind: { const: infographic }
        download: { $ref: '#/components/schemas/Media' }
    CurrencyCode: { type: string, pattern: '^[A-Z]{3}$' }
    Decimal: { type: string, pattern: '^-?[0-9]+(\.[0-9]+)?$', description: 'An exact decimal number, as text.' }
    DecimalOrNull:
      oneOf:
        - { $ref: '#/components/schemas/Decimal' }
        - { type: 'null' }
    Direction: { enum: [up, down, same, null] }
    CurrencyRate:
      type: object
      required: [code, name, symbol, decimals, mid, buy, sell, previous, change_pct, direction, is_manual, is_pegged, rate_date, published_at]
      properties:
        code: { $ref: '#/components/schemas/CurrencyCode' }
        name: { type: string }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0, maximum: 6 }
        mid: { $ref: '#/components/schemas/DecimalOrNull' }
        buy: { $ref: '#/components/schemas/Decimal' }
        sell: { $ref: '#/components/schemas/Decimal' }
        previous: { $ref: '#/components/schemas/DecimalOrNull' }
        change_pct: { $ref: '#/components/schemas/DecimalOrNull' }
        direction: { $ref: '#/components/schemas/Direction' }
        is_manual: { type: boolean }
        is_pegged: { type: boolean }
        rate_date: { type: [string, 'null'], format: date }
        published_at: { type: [string, 'null'], format: date-time }
    RatesMeta:
      type: object
      required: [published_at, rate_date, checked_at, source, note]
      properties:
        published_at: { type: [string, 'null'], format: date-time, description: 'When the bank published the rates shown.' }
        rate_date: { type: [string, 'null'], format: date, description: 'Their day (Asia/Hebron).' }
        checked_at: { type: [string, 'null'], format: date-time, description: 'Last time the source answered ("last update").' }
        source: { type: [string, 'null'] }
        note: { type: string, description: 'Show it with the rates (11.10).' }
    ConverterRule:
      type: object
      required: [rate, text]
      properties:
        rate: { enum: [buy, sell] }
        text: { type: string }
    WeatherCity:
      type: object
      required: [slug, name, path, is_default, latitude, longitude]
      properties:
        slug: { type: string }
        name: { type: string }
        path: { type: string, description: 'The page on the site: /weather/{slug}.' }
        is_default: { type: boolean }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    WeatherCondition:
      type: object
      required: [code, text, icon]
      properties:
        code: { type: integer, description: "The source's condition code." }
        text: { type: string, description: 'Arabic description.' }
        icon: { type: string, pattern: '^[a-z-]+-(day|night)$', description: "Raqam's icon: its key, then -day or -night." }
    WeatherNowShort:
      type: object
      required: [temperature, condition, is_day, observed_at, stale]
      properties:
        temperature: { type: number }
        condition: { $ref: '#/components/schemas/WeatherCondition' }
        is_day: { type: boolean }
        observed_at: { type: string, format: date-time }
        stale: { type: boolean }
    WeatherNow:
      allOf:
        - { $ref: '#/components/schemas/WeatherNowShort' }
        - type: object
          required: [feels_like, today, humidity, wind_kmh, wind_deg]
          properties:
            feels_like: { type: [number, 'null'] }
            today:
              description: Today's low and high (Palestine day) from the readings since midnight and the forecast for the rest of today.
              oneOf:
                - { type: object, required: [min, max], properties: { min: { type: number }, max: { type: number } } }
                - { type: 'null' }
            humidity: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            wind_kmh: { type: [number, 'null'], minimum: 0 }
            wind_deg: { type: [integer, 'null'], minimum: 0, maximum: 360 }
    WeatherDay:
      type: object
      required: [date, min, max, condition]
      properties:
        date: { type: string, format: date }
        min: { type: number }
        max: { type: number }
        condition: { $ref: '#/components/schemas/WeatherCondition' }
    WeatherMeta:
      type: object
      required: [attribution, units]
      properties:
        attribution: { const: 'Weather data © OpenWeather' }
        units:
          type: object
          required: [temperature, wind]
          properties:
            temperature: { const: C }
            wind: { const: km/h }
